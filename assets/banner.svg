<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 380" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070b19" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#022c22" />
    </linearGradient>

    <!-- Pipeline Metal Gradients -->
    <linearGradient id="pipeGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="30%" stop-color="#0284c7" />
      <stop offset="70%" stop-color="#0369a1" />
      <stop offset="100%" stop-color="#082f49" />
    </linearGradient>

    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.8" />
      <stop offset="50%" stop-color="#06b6d4" stop-opacity="1" />
      <stop offset="100%" stop-color="#3b82f6" stop-opacity="0.8" />
    </linearGradient>

    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#34d399" />
      <stop offset="100%" stop-color="#a7f3d0" />
    </linearGradient>

    <!-- Grid Pattern -->
    <pattern id="techGrid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1e293b" stroke-width="1" stroke-opacity="0.6" />
      <circle cx="40" cy="0" r="1.5" fill="#38bdf8" fill-opacity="0.3" />
    </pattern>

    <!-- Filter for Glow effects -->
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <style>
    .title-text {
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      font-weight: 900;
      font-size: 44px;
      letter-spacing: -0.5px;
    }
    .subtitle-text {
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      font-weight: 500;
      font-size: 17px;
      letter-spacing: 2px;
      text-transform: uppercase;
    }
    .badge-text {
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      font-weight: 600;
      font-size: 13px;
    }
    
    /* Dynamic Animated Flow */
    @keyframes pulseGlow {
      0%, 100% { opacity: 0.4; stroke-width: 3; }
      50% { opacity: 0.9; stroke-width: 5; }
    }
    @keyframes flowDash {
      0% { stroke-dashoffset: 200; }
      100% { stroke-dashoffset: 0; }
    }
    @keyframes pingSensor {
      0% { r: 4px; opacity: 1; }
      100% { r: 16px; opacity: 0; }
    }
    @keyframes scanMove {
      0% { transform: translateY(0px); opacity: 0.2; }
      50% { opacity: 0.8; }
      100% { transform: translateY(220px); opacity: 0.2; }
    }
    @keyframes floatOrb {
      0%, 100% { transform: translateY(0px) scale(1); }
      50% { transform: translateY(-8px) scale(1.05); }
    }

    .pulse-line {
      animation: pulseGlow 3s ease-in-out infinite;
    }
    .flow-stream {
      stroke-dasharray: 16 12;
      animation: flowDash 2.5s linear infinite;
    }
    .ping-circle {
      animation: pingSensor 2s cubic-bezier(0, 0.2, 0.8, 1) infinite;
    }
    .scanner-beam {
      animation: scanMove 4s ease-in-out infinite alternate;
    }
    .floating-card {
      animation: floatOrb 4s ease-in-out infinite;
    }
  </style>

  <!-- Background Base -->
  <rect width="1200" height="380" rx="16" fill="url(#bgGrad)" />
  <rect width="1200" height="380" rx="16" fill="url(#techGrid)" />

  <!-- Ambient Glow Orbs -->
  <circle cx="200" cy="100" r="180" fill="#0284c7" opacity="0.15" filter="url(#neonGlow)" />
  <circle cx="1050" cy="280" r="160" fill="#10b981" opacity="0.18" filter="url(#neonGlow)" />

  <!-- Abstract Pipeline System Graphics (Right side) -->
  <g transform="translate(740, 40)">
    <!-- Main Outer Pipe Outer Tube -->
    <rect x="30" y="70" width="380" height="42" rx="10" fill="#0f172a" stroke="#334155" stroke-width="2" />
    <rect x="30" y="74" width="380" height="34" rx="6" fill="url(#pipeGrad)" opacity="0.7" />
    
    <!-- Pipe Flow Stream -->
    <line x1="30" y1="91" x2="410" y2="91" stroke="#38bdf8" stroke-width="4" class="flow-stream" filter="url(#softGlow)" />
    
    <!-- Branching Vertical Pipe -->
    <path d="M 180 112 L 180 230 Q 180 260 210 260 L 410 260" fill="none" stroke="#1e293b" stroke-width="28" stroke-linecap="round" />
    <path d="M 180 112 L 180 230 Q 180 260 210 260 L 410 260" fill="none" stroke="#0284c7" stroke-width="16" stroke-linecap="round" opacity="0.8" />
    <path d="M 180 112 L 180 230 Q 180 260 210 260 L 410 260" fill="none" stroke="#34d399" stroke-width="3" class="flow-stream" filter="url(#softGlow)" />

    <!-- ILI Inspection Pig / Sensor Node -->
    <g class="floating-card">
      <rect x="230" y="65" width="70" height="52" rx="8" fill="#1e293b" stroke="#38bdf8" stroke-width="2" filter="url(#softGlow)" />
      <text x="265" y="88" fill="#38bdf8" font-family="'Segoe UI', sans-serif" font-weight="bold" font-size="11" text-anchor="middle">ILI PIG</text>
      <text x="265" y="104" fill="#34d399" font-family="'Segoe UI', sans-serif" font-size="9" text-anchor="middle">ACTIVE</text>
      <circle cx="288" cy="77" r="3" fill="#10b981" />
    </g>

    <!-- Inspection Sensor Nodes with Radar Pings -->
    <g transform="translate(110, 91)">
      <circle cx="0" cy="0" r="14" fill="none" stroke="#38bdf8" stroke-width="1.5" class="ping-circle" />
      <circle cx="0" cy="0" r="5" fill="#38bdf8" />
    </g>
    <g transform="translate(320, 260)">
      <circle cx="0" cy="0" r="16" fill="none" stroke="#10b981" stroke-width="1.5" class="ping-circle" />
      <circle cx="0" cy="0" r="5" fill="#10b981" />
    </g>

    <!-- Digital Twin Telemetry Card -->
    <g transform="translate(70, 160)" class="floating-card">
      <rect width="170" height="90" rx="10" fill="#0b1329" stroke="#1e293b" stroke-width="1.5" opacity="0.95" />
      <path d="M 0 0 L 170 0" stroke="#0284c7" stroke-width="3" />
      <text x="15" y="24" fill="#94a3b8" font-family="'Segoe UI', sans-serif" font-size="10" font-weight="600">CORROSION RATE</text>
      <text x="15" y="44" fill="#38bdf8" font-family="'Segoe UI', sans-serif" font-size="16" font-weight="bold">0.012 mm/yr</text>
      <text x="15" y="62" fill="#94a3b8" font-family="'Segoe UI', sans-serif" font-size="10" font-weight="600">INTEGRITY RISK INDEX</text>
      <text x="15" y="78" fill="#10b981" font-family="'Segoe UI', sans-serif" font-size="12" font-weight="bold">LOW / NORMAL</text>
      <polyline points="105,42 120,36 135,40 150,30" fill="none" stroke="#34d399" stroke-width="2" />
    </g>
  </g>

  <!-- Main Left Content -->
  <!-- Top Category Tag -->
  <g transform="translate(70, 60)">
    <rect width="320" height="28" rx="14" fill="#0f2744" stroke="#0284c7" stroke-width="1.2" />
    <text x="160" y="19" fill="#38bdf8" class="subtitle-text" text-anchor="middle" font-size="11">⚡ CURATED ECOSYSTEM &amp; PLATFORMS</text>
  </g>

  <!-- Title Text -->
  <g transform="translate(70, 130)">
    <text x="0" y="0" fill="url(#textGrad)" class="title-text" filter="url(#softGlow)">
      Awesome Pipeline Integrity
    </text>
    <text x="0" y="44" fill="#ffffff" class="title-text">
      Management
    </text>
  </g>

  <!-- Subtitle / Highlights -->
  <g transform="translate(70, 220)">
    <text x="0" y="0" fill="#94a3b8" font-family="'Segoe UI', system-ui, sans-serif" font-size="15" font-weight="400">
      Enterprise SaaS &amp; Open-Source Architectures for ILI Analytics, Cathodic Protection,
    </text>
    <text x="0" y="24" fill="#94a3b8" font-family="'Segoe UI', system-ui, sans-serif" font-size="15" font-weight="400">
      Corrosion Prediction, GIS Linear Referencing, Risk-Based Inspection &amp; Digital Twins.
    </text>
  </g>

  <!-- Capability Badges Footer -->
  <g transform="translate(70, 290)">
    <!-- Badge 1 -->
    <g transform="translate(0, 0)">
      <rect width="145" height="34" rx="8" fill="#111c35" stroke="#1e293b" stroke-width="1.2" />
      <text x="72" y="21" fill="#38bdf8" class="badge-text" text-anchor="middle">🔍 ILI &amp; NDT Analytics</text>
    </g>
    <!-- Badge 2 -->
    <g transform="translate(155, 0)">
      <rect width="165" height="34" rx="8" fill="#111c35" stroke="#1e293b" stroke-width="1.2" />
      <text x="82" y="21" fill="#34d399" class="badge-text" text-anchor="middle">🛡️ Corrosion Monitoring</text>
    </g>
    <!-- Badge 3 -->
    <g transform="translate(330, 0)">
      <rect width="150" height="34" rx="8" fill="#111c35" stroke="#1e293b" stroke-width="1.2" />
      <text x="75" y="21" fill="#a78bfa" class="badge-text" text-anchor="middle">🗺️ GIS Linear Network</text>
    </g>
    <!-- Badge 4 -->
    <g transform="translate(490, 0)">
      <rect width="140" height="34" rx="8" fill="#111c35" stroke="#1e293b" stroke-width="1.2" />
      <text x="70" y="21" fill="#f59e0b" class="badge-text" text-anchor="middle">📈 Risk Assessment</text>
    </g>
    <!-- Badge 5 -->
    <g transform="translate(640, 0)">
      <rect width="130" height="34" rx="8" fill="#111c35" stroke="#1e293b" stroke-width="1.2" />
      <text x="65" y="21" fill="#38bdf8" class="badge-text" text-anchor="middle">🌐 Digital Twins</text>
    </g>
  </g>
</svg>
